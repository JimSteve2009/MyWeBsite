<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Microwave sensing and metasurface research visual</title>
  <desc id="desc">Abstract microwave field lines, resonator patterns, and metasurface tiles for an academic homepage.</desc>
  <defs>
